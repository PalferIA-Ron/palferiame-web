name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 -H 147.93.93.199 >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avzr --delete \
            --exclude='.git*' \
            --exclude='_assets/' \
            --exclude='_content/' \
            --exclude='_preview/' \
            --exclude='assets/_capturas/' \
            -e "ssh -p 65002 -i ~/.ssh/id_ed25519" \
            ./ \
            u454444055@147.93.93.199:/home/u454444055/domains/palferia.me/public_html/
