<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Palferia.me</title>
  <meta http-equiv="refresh" content="5;url=/">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--deep:#012D38;--accent:#B1F727;--text:#EFF8FF;--muted:#7BB5C4;--fh:'Barlow Condensed',sans-serif;--fd:'Bebas Neue',sans-serif}
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;700&display=swap');
    body{background:var(--deep);color:var(--text);font-family:var(--fh);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
    .code{font-family:var(--fd);font-size:clamp(6rem,20vw,14rem);line-height:1;color:var(--accent);opacity:.12;position:absolute}
    .inner{position:relative;z-index:1}
    .label{font-size:.72rem;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:1.5rem}
    h1{font-family:var(--fd);font-size:clamp(2.5rem,6vw,5rem);line-height:.95;margin-bottom:1rem}
    p{color:var(--muted);font-size:1rem;line-height:1.7;margin-bottom:2rem}
    a{font-weight:700;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--deep);background:var(--accent);padding:.8rem 2rem;border-radius:2px;text-decoration:none;transition:opacity .2s}
    a:hover{opacity:.85}
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
</head>
<body>
  <div class="code" aria-hidden="true">404</div>
  <div class="inner">
    <div class="label">Palferia.me</div>
    <h1>Página no<br>encontrada</h1>
    <p>Esta URL no existe. Volvemos al inicio en 5 segundos.</p>
    <a href="/">Volver al inicio →</a>
  </div>
</body>
</html>
